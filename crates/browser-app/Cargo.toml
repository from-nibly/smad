[package]
name = "smad"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_10"] }
webkit6 = "0.6.1"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-themes", "regex-onig", "parsing"] }
merman = { version = "=0.9.0", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape"] }
url.workspace = true
smad-core = { path = "../core" }
smad-control = { path = "../control" }
smad-protocol = { path = "../protocol" }

[build-dependencies]
syntect = { version = "5.3", default-features = false, features = ["regex-onig", "yaml-load", "dump-create"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-onig"] }

[dev-dependencies]
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-onig"] }
serde_json.workspace = true
