[package]
name = "smad"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_10"] }
webkit6 = "0.6.1"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
merman = { version = "=0.9.0", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape"] }
url.workspace = true
smad-core = { path = "../core" }
smad-control = { path = "../control" }
smad-protocol = { path = "../protocol" }
