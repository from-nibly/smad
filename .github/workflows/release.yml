name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install native build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev librsvg2-common \
            pkg-config xvfb dbus python3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: wasm32-wasip1
          components: clippy, rustfmt

      - name: Verify workspace and native renderers
        env:
          TMPDIR: /tmp
        run: |
          cargo fetch --locked
          ./scripts/check.sh
          python3 tests/e2e/native_markdown.py

      - name: Build release artifacts
        run: |
          cargo build --locked --release -p smad -p smad-cli
          cargo build --locked --release -p smad-zellij --target wasm32-wasip1
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          test "$(target/release/smad --version)" = "smad $version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          target/release/smad-axi --version --json

      - name: Package server, AXI, integrations and notices
        run: |
          ./packaging/install.sh --no-build --prefix "$RUNNER_TEMP/smad"
          tar -C "$RUNNER_TEMP" -czf smad-x86_64-linux.tar.gz smad
          cp target/release/smad smad-server-x86_64-linux
          cp target/release/smad-axi smad-axi-x86_64-linux
          # Standalone downloads must carry the same attribution/source bundle.
          tar -C "$RUNNER_TEMP/smad/share/smad" -czf smad-third-party-notices.tar.gz licenses
          sha256sum smad-x86_64-linux.tar.gz smad-server-x86_64-linux \
            smad-axi-x86_64-linux smad-third-party-notices.tar.gz > SHA256SUMS

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(smad-x86_64-linux.tar.gz smad-server-x86_64-linux smad-axi-x86_64-linux smad-third-party-notices.tar.gz SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --notes-file "docs/releases/$GITHUB_REF_NAME.md" --title "SMAD $GITHUB_REF_NAME"
          fi
