[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/core",
  "crates/control",
  "crates/browser-cli",
  "crates/browser-app",
  "crates/zellij-plugin",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
publish = false

[profile.release]
strip = "symbols"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = { version = "2.5", features = ["serde"] }
